# === USER ===
type User
  @model
  @auth(rules: [{ allow: owner, ownerField: "owner" }]) {
  id: ID!
  owner: String!
  email: AWSEmail!
  firstName: String!
  lastName: String!
  birthday: AWSDate!
  photoPath: String
  bio: String
  xP: Int! @default(value: "0")

  # Relationships (all nullable)
  highlights: [Highlight] @hasMany(indexName: "byUser", fields: ["id"])
  comments: [Comment] @hasMany(indexName: "byUser", fields: ["id"])
  bookmarks: [Bookmark] @hasMany(indexName: "byUser", fields: ["id"])
  studySets: [StudySet] @hasMany(indexName: "byUser", fields: ["id"])
  posts: [Post] @hasMany(indexName: "byUser", fields: ["id"])
  postComments: [PostComment] @hasMany(indexName: "byUser", fields: ["id"])
}

# === HIGHLIGHTS ===
type Highlight
  @model
  @auth(rules: [{ allow: owner, ownerField: "owner" }]) {
  id: ID!
  userId: ID! @index(name: "byUser", sortKeyFields: ["createdAt"])
  owner: String!
  user: User @belongsTo(fields: ["userId"])
  book: String!
  chapter: Int!
  verse: Int!
  color: String
  note: String
  tag: String
  text: String # ⬅️ NEW: store verse text for direct rendering
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

# === COMMENTS ===
type Comment
  @model
  @auth(rules: [{ allow: owner, ownerField: "owner" }]) {
  id: ID!
  userId: ID! @index(name: "byUser", sortKeyFields: ["createdAt"])
  owner: String!
  verseKey: String! @index(name: "byVerse", sortKeyFields: ["createdAt"])
  user: User @belongsTo(fields: ["userId"])
  book: String!
  chapter: Int!
  verse: Int!
  title: String
  body: String
  text: String # ⬅️ NEW: verse text stored for direct rendering
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

# === BOOKMARKS ===
type Bookmark
  @model
  @auth(rules: [{ allow: owner, ownerField: "owner" }]) {
  id: ID!
  userId: ID! @index(name: "byUser", sortKeyFields: ["createdAt"])
  owner: String!
  user: User @belongsTo(fields: ["userId"])
  book: String!
  chapter: Int!
  verse: Int!
  label: String
  text: String # ⬅️ NEW: verse text stored for direct rendering
  createdAt: AWSDateTime!
}

# === STUDY SETS ===
type StudySet
  @model
  @auth(rules: [{ allow: owner, ownerField: "owner" }]) {
  id: ID!
  userId: ID! @index(name: "byUser", sortKeyFields: ["createdAt"])
  owner: String!
  user: User @belongsTo(fields: ["userId"])
  title: String!
  description: String
  color: String
  verses: [StudySetVerse] @hasMany(indexName: "byStudySet", fields: ["id"])
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type StudySetVerse
  @model
  @auth(rules: [{ allow: owner, ownerField: "studySetOwner" }]) {
  id: ID!
  studySetId: ID! @index(name: "byStudySet", sortKeyFields: ["createdAt"])
  studySetOwner: String!
  book: String!
  chapter: Int!
  verse: Int!
  note: String
  text: String # ⬅️ NEW: include verse text for study set rendering
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

# === SOCIAL POSTS ===
type Post
  @model
  @auth(rules: [
    { allow: owner, ownerField: "owner" },
    { allow: private, operations: [read] }
  ]) {
  id: ID!
  userId: ID! @index(name: "byUser", sortKeyFields: ["createdAt"])
  owner: String!
  user: User @belongsTo(fields: ["userId"])
  content: String!
  verseRef: String
  mediaUrl: String
  likes: Int! @default(value: "0")
  comments: [PostComment] @hasMany(indexName: "byPost", fields: ["id"])
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

# === COMMENTS ON POSTS ===
type PostComment
  @model
  @auth(rules: [{ allow: owner, ownerField: "owner" }]) {
  id: ID!
  postId: ID! @index(name: "byPost", sortKeyFields: ["createdAt"])
  userId: ID! @index(name: "byUser", sortKeyFields: ["createdAt"])
  owner: String!
  user: User @belongsTo(fields: ["userId"])
  content: String!
  createdAt: AWSDateTime!
}

# === FRIENDSHIPS ===
type Friendship
  @model
  @auth(rules: [
    { allow: owner, ownerField: "owner" },
    { allow: private, operations: [read] }
  ]) {
  id: ID!
  userId: ID! @index(name: "byUser", sortKeyFields: ["createdAt"])
  owner: String!
  friendId: ID!
  status: String!
  createdAt: AWSDateTime!
}

# === SHARED STUDY SETS ===
type SharedStudySet
  @model
  @auth(rules: [
    { allow: owner, ownerField: "owner" },
    { allow: private, operations: [read] }
  ]) {
  id: ID!
  studySetId: ID! @index(name: "byStudySet", sortKeyFields: ["sharedWithUserId"])
  sharedWithUserId: ID!
  owner: String!
  permissions: String! @default(value: "view")
  createdAt: AWSDateTime!
}
